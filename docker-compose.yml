services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  main-service:
    image: vshakago/main-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.main
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DB_API_URL=http://centralized-db-api:3003
      - BOOKING_API_URL=http://booking-service:3002
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      - redis
      - centralized-db-api
    restart: unless-stopped

  admin-service:
    image: vshakago/admin-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.admin
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DB_API_URL=http://centralized-db-api:3003
      - MAIN_API_URL=http://main-service:3000
      - BOOKING_API_URL=http://booking-service:3002
    depends_on:
      - redis
      - centralized-db-api
    restart: unless-stopped

  booking-service:
    image: vshakago/booking-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.booking
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - DB_API_URL=http://centralized-db-api:3003
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - redis
      - centralized-db-api
    restart: unless-stopped

  centralized-db-api:
    image: vshakago/centralized-db-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.centralized-db
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - ${APP_DATA_DIR:-.}/resort_booking.db:/app/resort_booking.db
    depends_on:
      - redis
    restart: unless-stopped

  websocket-service:
    image: vshakago/websocket-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.websocket
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
  db-data:
